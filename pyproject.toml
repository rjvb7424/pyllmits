[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyllmits"
version = "0.5.0"
description = "Large Language Model Instinct Testing under Survival - benchmark LLMs in a hand-built Crafter survival world."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "rjvb7424", email = "julio12206.cesar@gmail.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "crafter>=1.8.0",
    "numpy",
    "Pillow",
    "ruamel.yaml",
    "imageio",
    "imageio-ffmpeg",
    "opensimplex",
    "matplotlib",
    "python-dotenv",
    "torch",
    "transformers",
    "accelerate",
    "openai",
    "google-genai",
]

[project.urls]
Repository = "https://github.com/rjvb7424/summer-2026-internship"

[project.scripts]
llmits = "llmits.cli:main"

# The llmits package lives under src/; main.py at the repo root is shipped as
# a top-level module so the published `import main; main.main()` entry point
# keeps working for existing users.
[tool.setuptools]
package-dir = { "" = ".", "llmits" = "src/llmits" }
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"llmits.assets" = ["*.png", "*.mp4"]
