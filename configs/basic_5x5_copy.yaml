experiment:
  name: basic_5x5_copy
  output_dir: runs
  num_trials: 5
  max_turns: 100
  seed: 0
  same_world_each_trial: true
  record_video: true
  video_fps: 4
objective:
  type: achievement
  target: collect_wood
  item: wood
  amount: 1
world:
  size:
  - 5
  - 5
  base_terrain: grass
  player_start:
  - 2
  - 3
  static: true
  freeze_daylight: true
  inventory: {}
  features:
    trees:
      positions:
      - - 2
        - 1
      count: 0
  entities: {}
prompt:
  include_legend: true
  include_inventory: true
  include_achievements: true
  include_action_list: true
  system: "You are an agent playing Crafter, a 2D survival game played on a grid.\nEach turn you see a top-down map and must choose ONE action to progress\ntoward the goal. You act on the tile directly in front of you (the tile in\nyour FACING direction), so to interact with something you must be adjacent\nto it and facing it, then use the 'do' action.\nReply with one short line of reasoning, then a final line in exactly this\nformat:\nACTION: <action_name>\n"
  user: "GOAL: {objective}\n\nMAP (top-down; row = y increases downward, column = x increases rightward):\n{map}\n\nLEGEND:\n{legend}\n\nYOUR POSITION: {position}   FACING: {facing}\n\nINVENTORY:\n{inventory}\n\nACHIEVEMENTS UNLOCKED: {achievements}\n\nAVAILABLE ACTIONS:\n{actions}\n\nDecide your single next action. End your reply with:\nACTION: <action_name>\n"
actions:
  strategy: keyword
  fallback: noop
models:
- name: microsoft/phi-4
  backend: huggingface-api
  max_tokens: 256
  temperature: 0.7
  dtype: auto
  device: auto
- name: o3-2025-04-16
  backend: openai
  temperature: 0.7
  request_delay: 5.0
  dtype: auto
  device: auto
- name: deepseek-ai/DeepSeek-R1
  backend: huggingface-api
  max_tokens: 256
  temperature: 0.7
  dtype: auto
  device: auto
- name: heuristic-baseline
  backend: mock
  policy: heuristic
  fixed_action: noop
